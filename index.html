<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koran App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Karla:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <p class="eyebrow">Trin 3 · Oversættelse</p>
      <label class="select-label" for="sura-select">Vælg sura</label>
      <select id="sura-select" class="sura-select" aria-label="Vælg sura"></select>
      <h1 class="sura-name-ar" id="sura-name-ar" dir="rtl"></h1>
      <p class="sura-name-da" id="sura-name-en"></p>
    </header>

    <p class="status" id="status" role="status" hidden></p>
    <p class="translation-note" id="translation-note" hidden></p>

    <section class="verses" id="verses" aria-label="Vers fra den valgte sura"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
