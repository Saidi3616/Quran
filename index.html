<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koran App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Karla:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <p class="eyebrow">Trin 5 · Søgning</p>
      <label class="select-label" for="sura-select">Vælg sura</label>
      <select id="sura-select" class="sura-select" aria-label="Vælg sura"></select>
      <h1 class="sura-name-ar" id="sura-name-ar" dir="rtl"></h1>
      <p class="sura-name-da" id="sura-name-en"></p>
    </header>

    <div class="mode-toggle" role="radiogroup" aria-label="Visningstype">
      <button type="button" class="mode-btn" data-mode="arabic">Arabisk</button>
      <button type="button" class="mode-btn" data-mode="english">Engelsk</button>
      <button type="button" class="mode-btn is-active" data-mode="both">Begge</button>
    </div>

    <button type="button" id="play-surah-btn" class="play-surah-btn">
      <svg class="icon-play" viewBox="0 0 24 24" width="16" height="16"><path d="M8 5v14l11-7z"/></svg>
      <svg class="icon-pause is-hidden" viewBox="0 0 24 24" width="16" height="16"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      <span>Afspil hele suraen</span>
    </button>

    <form id="search-form" class="search-form">
      <input
        type="search"
        id="search-input"
        class="search-input"
        placeholder="Søg i oversættelsen (lige nu engelsk), fx “mercy”"
        aria-label="Søgeord"
      />
      <button type="submit" class="search-button">Søg</button>
    </form>
    <div class="search-results" id="search-results" hidden></div>

    <p class="status" id="status" role="status" hidden></p>
    <p class="translation-note" id="translation-note" hidden></p>

    <section class="verses" id="verses" aria-label="Vers fra den valgte sura"></section>
  </main>

  <div class="debug-audio" id="debug-audio">
    <p class="debug-audio-label">Midlertidig fejlfindings-lydbjælke (fjernes igen senere)</p>
    <audio id="audio-player" controls></audio>
    <a id="debug-audio-link" href="#" target="_blank" rel="noopener">Åbn lydfilen direkte i en ny fane</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
